<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Memanggil font tulisan tangan: Dancing Script & Caveat -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0c10;
    --card-bg: rgba(255, 255, 255, 0.05);
    --neon-pink: #ff2a75;
    --neon-blue: #00e5ff;
    --text-main: #f0f0f0;
    --text-sub: #a0a5b5;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Latar belakang cahaya */
  .bg-glow {
    position: absolute;
    width: 100vw; height: 100vh;
    z-index: -1;
    background: 
      radial-gradient(circle at 15% 20%, rgba(255, 42, 117, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0, 229, 255, 0.15) 0%, transparent 40%);
    animation: pulseGlow 8s ease-in-out infinite alternate;
  }
  @keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.1); opacity: 1; }
  }

  /* Partikel bintang */
  .stars-container {
    position: absolute; inset: 0; z-index: -1;
    pointer-events: none;
  }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff; }
    100% { opacity: 0.2; transform: scale(0.8); }
  }

  /* Halaman Utama */
  .stage {
    text-align: center;
    padding: 24px;
    z-index: 1;
    animation: fadeIn 1.5s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* FONT TULISAN TANGAN UNTUK JUDUL UTAMA */
  .title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 700;
    line-height: 1.2;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 15px rgba(255, 42, 117, 0.3));
  }

  .subtitle {
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--text-sub);
    margin-bottom: 40px;
    font-size: 0.9rem;
  }

  .btn {
    position: relative;
    background: transparent;
    color: var(--text-main);
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.4s ease;
    box-shadow: 0 0 10px var(--neon-pink), 0 0 20px rgba(255, 42, 117, 0.4);
    border: 1px solid rgba(255, 42, 117, 0.5);
  }
  .btn:hover {
    background: rgba(255, 42, 117, 0.1);
    box-shadow: 0 0 20px var(--neon-pink), 0 0 40px rgba(255, 42, 117, 0.6);
    transform: translateY(-3px);
  }
  .btn:active { transform: scale(0.95); }

  /* Overlay Pop-up */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    background: rgba(5, 5, 10, 0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* Kartu Kaca (Glassmorphism) */
  .card {
    position: relative;
    width: min(500px, 100%);
    max-height: 88vh; overflow-y: auto;
    padding: 50px 35px;
    text-align: center;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    transform: translateY(30px) scale(0.9);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
  }
  .overlay.open .card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  /* Efek garis neon di pinggir kartu */
  .card::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--neon-pink), transparent 40%, transparent 60%, var(--neon-blue));
    z-index: -1;
    opacity: 0.5;
    transition: opacity 0.3s;
  }
  .overlay.open .card::before { opacity: 1; }

  .close {
    position: absolute; top: 15px; right: 15px; z-index: 10;
    width: 36px; height: 36px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-sub);
    font-size: 1.5rem; line-height: 1;
    cursor: pointer;
    transition: 0.3s;
  }
  .close:hover {
    background: rgba(255, 42, 117, 0.2);
    color: #fff;
    transform: rotate(90deg);
  }

  /* --- TAMPILAN DEPAN (AMPLOP) --- */
  .envelope-icon {
    font-size: 4rem;
    color: var(--neon-blue);
    margin-bottom: 20px;
    display: inline-block;
    filter: drop-shadow(0 0 15px var(--neon-blue));
    animation: floatEnv 3s ease-in-out infinite;
  }
  @keyframes floatEnv {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* FONT TULISAN TANGAN UNTUK JUDUL POPUP */
  .front-title {
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    color: #fff;
    margin-bottom: 10px;
  }

  .btn-inner {
    margin-top: 25px;
    padding: 12px 35px;
    background: transparent;
    border: 1px solid var(--neon-blue);
    color: var(--neon-blue);
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
  }
  .btn-inner:hover {
    background: rgba(0, 229, 255, 0.1);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
    transform: translateY(-2px);
  }

  /* --- TAMPILAN BELAKANG (PESAN) --- */
  .icon-heart {
    font-size: 2rem;
    color: var(--neon-pink);
    margin-bottom: 10px;
    display: inline-block;
    animation: heartbeat 1.5s infinite;
    filter: drop-shadow(0 0 10px var(--neon-pink));
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  /* FONT TULISAN TANGAN UNTUK SAPAAN */
  .card h2 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.5rem, 8vw, 3.2rem);
    font-weight: 600;
    color: #fff;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  /* FONT TULISAN TANGAN UNTUK ISI PESAN */
  .card p.msg {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.5rem, 5vw, 1.8rem);
    line-height: 1.4;
    font-weight: 400;
    color: #e2e8f0;
    white-space: pre-wrap;
    min-height: 1em;
  }

  .type-cursor {
    display: inline-block; width: 2px; height: 1.1em;
    background: var(--neon-blue); margin-left: 3px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 5px var(--neon-blue);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Dancing Script', cursive;
    font-size: 1.8rem;
    color: var(--neon-blue);
    margin-top: 20px;
    opacity: 0;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    animation: fadeUp 1s ease 2.5s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card { padding: 40px 20px; }
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="stars-container" id="stars"></div>

  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">SEBUAH PESAN KECIL YANG DIBUAT KHUSUS UNTUKMU</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card" id="card">
      <button class="close" id="closeBtn" type="button" aria-label="Tutup">&times;</button>
      
      <!-- TAMPILAN DEPAN (SEBELUM DIKLIK) -->
      <div id="cardFront">
        <div class="envelope-icon">&#9993;</div> <!-- Ikon Amplop -->
        <h2 class="front-title">Ada Pesan!</h2>
        <p style="color: var(--text-sub); font-size: 0.9rem; font-family: 'Poppins', sans-serif;">Pesan ini hanya untuk Bila</p>
        <button class="btn-inner" id="revealBtn">Klik Disini</button>
      </div>

      <!-- TAMPILAN BELAKANG (ISI PESAN) -->
      <div id="cardBack" style="display: none;">
        <div class="icon-heart">&#10084;</div>
        <h2 id="cardTitle">Hai, Bila</h2>
        <p class="msg" id="msgText"></p>
        <p class="signature">— Dari aku</p>
      </div>

    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgEl    = document.getElementById('msgText');
  
  const cardFront = document.getElementById('cardFront');
  const cardBack  = document.getElementById('cardBack');
  const revealBtn = document.getElementById('revealBtn');

  // ==========================================
  // PESAN SUDAH DIGANTI DI SINI:
  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏';
  // ==========================================

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
    let i = 0;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    msgEl.appendChild(cursor);

    function step() {
      if (i < MESSAGE.length) {
        const ch = MESSAGE[i];
        if (ch === '\n') {
          cursor.before(document.createElement('br'));
        } else {
          cursor.before(document.createTextNode(ch));
        }
        i++;
        const pause = /[.,!?]/.test(ch) ? 100 : 30; 
        typingTimer = setTimeout(step, pause);
      } else {
        setTimeout(() => cursor.remove(), 1500);
      }
    }
    step();
  }

  const openCard = () => {
    overlay.classList.add('open');
    cardFront.style.display = 'block';
    cardBack.style.display = 'none';
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    clearTimeout(typingTimer);
  };

  openBtn.addEventListener('click', openCard);

  revealBtn.addEventListener('click', () => {
    cardFront.style.display = 'none'; 
    cardBack.style.display = 'block'; 
    typeMessage();                    
  });

  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

  (function createStars() {
    const container = document.getElementById('stars');
    const numStars = 40;
    for (let i = 0; i < numStars; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.animationDelay = (Math.random() * 3) + 's';
      container.appendChild(star);
    }
  })();
</script>
</body>
</html>
