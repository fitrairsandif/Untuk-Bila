<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text-main: #1a1a1a; 
    --accent: #d4a373; 
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    color: var(--text-main);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: #f4f1ea;
  }

  /* =========================================
     BACKGROUND HALAMAN UTAMA (MATAHARI -> GALAKSI)
     ========================================= */
  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 1;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: -3; transition: opacity 1.5s ease;
    opacity: 1;
  }
  
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop'); 
    background-size: cover; background-position: center;
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 0;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: rgba(5, 5, 15, 0.4); 
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: -3; transition: opacity 1.5s ease;
    opacity: 0;
  }

  /* =========================================
     HALAMAN UTAMA
     ========================================= */
  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1; 
    color: #1a1a1a; margin-bottom: 15px;
    text-shadow: 0 4px 15px rgba(255,255,255,0.9);
  }

  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,0.9);
    margin-bottom: 50px;
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px); }

  /* =========================================
     POP-UP MODAL 
     ========================================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* WADAH KARTU */
  .card-wrapper {
    position: relative;
    width: min(480px, 100%);
    display: grid; place-items: center;
  }

  /* =========================================
     KARTU PESAN (ISI GALAKSI)
     ========================================= */
  .card-content {
    position: relative;
    width: 100%;
    max-height: 85vh; overflow-y: auto;
    padding: 60px 40px; text-align: center;
    
    /* Menggunakan gambar galaksi + overlay gelap agar teks terbaca */
    background: linear-gradient(rgba(10, 10, 20, 0.4), rgba(10, 10, 20, 0.7)), 
                url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
    
    border-radius: 20px; 
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.5);
    
    transform: translateY(40px) scale(0.95); opacity: 0;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    z-index: 10;
  }
  .overlay.open .card-content { transform: translateY(0) scale(1); opacity: 1; }

  /* =========================================
     GARIS BENANG LIAR WARNA-WARNI
     ========================================= */
  .thread-svg {
    position: absolute;
    top: -60px; left: -60px; right: -60px; bottom: -60px;
    width: calc(100% + 120px); height: calc(100% + 120px);
    z-index: 5; pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease 0.3s;
  }
  .overlay.open .thread-svg { opacity: 1; }

  .thread-svg path {
    fill: none;
    stroke-width: 1.5; /* Benang tipis */
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 3px currentColor); /* Glow tipis */
  }

  /* Tombol Close */
  .close {
    position: absolute; top: 20px; right: 20px; z-index: 20;
    width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: #fff; color: #111; transform: rotate(90deg); }

  /* =========================================
     TEKS & ANIMASI
     ========================================= */
  .card-content h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.2rem; color: var(--accent); margin-bottom: 25px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .card-content p.msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; line-height: 1.7; font-style: italic; font-weight: 400;
    color: #f0f0f0; 
    text-shadow: 0 2px 5px rgba(0,0,0,0.9); /* Bayangan teks agar jelas di atas galaksi */
    display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: 0.5px;
  }

  .msg-line {
    display: block; min-height: 1.2em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.5rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    animation: fadeUp 1s ease 4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card-content { padding: 50px 25px; }
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .card-content p.msg { font-size: 1.25rem; }
    .thread-svg {
      top: -40px; left: -40px; right: -40px; bottom: -40px;
      width: calc(100% + 80px); height: calc(100% + 80px);
    }
  }
</style>
</head>
<body>

  <!-- Background Layer Halaman -->
  <div class="bg-sunflower" id="bgSunflower"></div>
  <div class="overlay-sunflower" id="overlaySunflower"></div>
  
  <div class="bg-galaxy" id="bgGalaxy"></div>
  <div class="overlay-galaxy" id="overlayGalaxy"></div>

  <!-- Halaman Utama -->
  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <!-- Pop-up Card -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card-wrapper">
      
      <!-- SVG BENANG LIAR -->
      <svg class="thread-svg" viewBox="0 0 200 300" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gPink" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff7eb3"/><stop offset="100%" stop-color="#ff758c"/></linearGradient>
          <linearGradient id="gCyan" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0072ff"/></linearGradient>
          <linearGradient id="gGold" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#d4a373"/><stop offset="100%" stop-color="#faedcd"/></linearGradient>
          <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#b388ff"/><stop offset="100%" stop-color="#8e24aa"/></linearGradient>
          <linearGradient id="gGreen" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00b09b"/><stop offset="100%" stop-color="#96c93d"/></linearGradient>
          <linearGradient id="gOrange" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ff9a9e"/><stop offset="100%" stop-color="#fecfef"/></linearGradient>
        </defs>

        <path stroke="url(#gPink)" color="#ff7eb3">
          <animate attributeName="d" dur="7s" repeatCount="indefinite" values="
            M -10,20 C 50,-20 150,80 210,50 C 180,150 100,250 -10,200 C -30,100 -10,20 -10,20;
            M -20,50 C 80,10 120,60 220,20 C 160,180 120,280 -20,250 C -40,150 -20,50 -20,50;
            M -10,20 C 50,-20 150,80 210,50 C 180,150 100,250 -10,200 C -30,100 -10,20 -10,20
          " />
        </path>
        <path stroke="url(#gCyan)" color="#00e5ff">
          <animate attributeName="d" dur="9s" repeatCount="indefinite" values="
            M 210,20 C 150,-10 50,90 -10,40 C 20,150 80,260 210,220 C 230,120 210,20 210,20;
            M 220,60 C 120,0 80,70 -20,30 C 40,170 100,270 220,240 C 240,140 220,60 220,60;
            M 210,20 C 150,-10 50,90 -10,40 C 20,150 80,260 210,220 C 230,120 210,20 210,20
          " />
        </path>
        <path stroke="url(#gGold)" color="#d4a373">
          <animate attributeName="d" dur="11s" repeatCount="indefinite" values="
            M -10,150 C 60,80 140,220 210,150 C 150,60 50,280 -10,150;
            M -10,130 C 40,100 160,250 210,130 C 160,80 60,250 -10,130;
            M -10,150 C 60,80 140,220 210,150 C 150,60 50,280 -10,150
          " />
        </path>
        <path stroke="url(#gPurple)" color="#b388ff">
          <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
            M 50,300 C -20,200 100,100 20,0 C 120,20 180,180 150,-20;
            M 30,300 C 0,180 120,120 40,-10 C 100,40 160,200 130,-30;
            M 50,300 C -20,200 100,100 20,0 C 120,20 180,180 150,-20
          " />
        </path>
        <path stroke="url(#gGreen)" color="#00b09b">
          <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
            M 150,300 C 220,200 80,120 180,0 C 80,40 -20,150 -10,-20;
            M 130,300 C 250,180 60,100 160,-10 C 100,20 0,180 10,-30;
            M 150,300 C 220,200 80,120 180,0 C 80,40 -20,150 -10,-20
          " />
        </path>
        <path stroke="url(#gOrange)" color="#ff9a9e">
          <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
            M 0,80 C 100,120 80,-20 200,-10 C 180,100 120,200 200,280;
            M 0,100 C 120,80 60,-30 180,-20 C 200,120 140,180 220,260;
            M 0,80 C 100,120 80,-20 200,-10 C 180,100 120,200 200,280
          " />
        </path>
      </svg>

      <!-- Isi Pesan -->
      <div class="card-content">
        <button class="close" id="closeBtn" type="button">&times;</button>
        
        <h2>Hai, Bila</h2>
        <p class="msg" id="msgContainer"></p>
        <p class="signature">— Dari aku, Fitra</p>
      </div>
      
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');

  const bgSunflower = document.getElementById('bgSunflower');
  const overlaySunflower = document.getElementById('overlaySunflower');
  const bgGalaxy = document.getElementById('bgGalaxy');
  const overlayGalaxy = document.getElementById('overlayGalaxy');

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        let pause = 65; 
        if (/[.,!?]/.test(char)) pause = 250; 
        else if (char === ' ') pause = 80; 
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        typingTimer = setTimeout(typeLine, 300); 
      }
    }
    typeLine();
  }

  const openCard = () => {
    overlay.classList.add('open');
    bgSunflower.style.opacity = '0';
    overlaySunflower.style.opacity = '0';
    bgGalaxy.style.opacity = '1';
    overlayGalaxy.style.opacity = '1';
    setTimeout(typeMessage, 500); 
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    bgSunflower.style.opacity = '1';
    overlaySunflower.style.opacity = '1';
    bgGalaxy.style.opacity = '0';
    overlayGalaxy.style.opacity = '0';
    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
