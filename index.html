<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4a373; 
    --bg-dark: #05050A;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: var(--bg-dark);
  }

  /* =========================================
     BACKGROUND TRANSISI (MATAHARI -> GALAKSI)
     ========================================= */
  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -5; transition: opacity 1.5s ease;
    opacity: 1;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.3); 
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 1;
  }
  
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop'); 
    background-size: cover; background-position: center;
    z-index: -5; transition: opacity 1.5s ease;
    opacity: 0;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: rgba(5, 5, 10, 0.5); 
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 0;
  }

  /* Partikel Bintang Jatuh */
  .stars {
    position: absolute; inset: 0; z-index: -3;
    pointer-events: none; opacity: 0; transition: opacity 2s ease;
  }
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 5px #fff;
    animation: shootingStar linear infinite;
  }
  @keyframes shootingStar {
    0% { transform: translateY(-100px) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh) translateX(-200px); opacity: 0; }
  }

  /* =========================================
     HALAMAN UTAMA
     ========================================= */
  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1; 
    color: #1a1a1a; margin-bottom: 15px;
    text-shadow: 0 4px 20px rgba(255,255,255,1);
  }

  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,1);
    margin-bottom: 50px;
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px); }

  /* =========================================
     POP-UP MODAL 
     ========================================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* WADAH KARTU & PITA ASTRAL */
  .card-wrapper {
    position: relative;
    width: min(420px, 100%);
    display: grid; place-items: center;
  }

  /* PITA ASTRAL (GARIS CAHAYA) */
  .astral-ribbons {
    position: absolute;
    width: 140%; height: 140%;
    z-index: 5; pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease 0.5s;
  }
  .overlay.open .astral-ribbons { opacity: 1; }

  .astral-ribbons path {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    /* Efek pendaran neon */
    filter: drop-shadow(0 0 8px currentColor);
  }

  /* =========================================
     KARTU KACA GALAKSI
     ========================================= */
  .card-content {
    position: relative;
    width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 60px 35px; text-align: center;
    
    background: rgba(15, 15, 25, 0.4); /* Kaca gelap transparan */
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px);
    
    border-radius: 24px; 
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    
    transform: translateY(40px) scale(0.95); opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    z-index: 10; 
  }
  .overlay.open .card-content { transform: translateY(0) scale(1); opacity: 1; }

  /* Tombol Close */
  .close {
    position: absolute; top: 20px; right: 20px; z-index: 20;
    width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: #fff; color: #111; transform: rotate(90deg); }

  /* =========================================
     TEKS & ANIMASI
     ========================================= */
  .card-content h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.4rem; color: var(--accent); margin-bottom: 25px;
    text-shadow: 0 2px 15px rgba(212, 163, 115, 0.4);
  }

  .card-content p.msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; line-height: 1.7; font-style: italic; font-weight: 400;
    color: #fff; 
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: 0.5px;
  }

  .msg-line {
    display: block; min-height: 1.2em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px; animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.5rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    animation: fadeUp 1s ease 4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card-content { padding: 50px 25px; }
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .card-content p.msg { font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <!-- Background -->
  <div class="bg-sunflower" id="bgSunflower"></div>
  <div class="overlay-sunflower" id="overlaySunflower"></div>
  <div class="bg-galaxy" id="bgGalaxy"></div>
  <div class="overlay-galaxy" id="overlayGalaxy"></div>
  <div class="stars" id="starContainer"></div>

  <!-- Halaman Utama -->
  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <!-- Pop-up Card -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card-wrapper">
      
      <!-- PITA CAHAYA ASTRAL (MENGORBIT) -->
      <svg class="astral-ribbons" viewBox="0 0 400 400">
        <defs>
          <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff7eb3"/><stop offset="100%" stop-color="#ff758c"/></linearGradient>
          <linearGradient id="gradCyan" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0072ff"/></linearGradient>
          <linearGradient id="gradGold" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#d4a373"/><stop offset="100%" stop-color="#faedcd"/></linearGradient>
        </defs>

        <!-- Pita 1: Melingkar Halus -->
        <path stroke="url(#gradPink)" color="#ff7eb3">
          <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
            M 50,100 C 150,-50 250,-50 350,100 C 450,250 300,450 200,450 C 100,450 -50,250 50,100 Z;
            M 100,50 C 50,150 -50,250 100,350 C 250,450 450,300 450,200 C 450,100 250,-50 100,50 Z;
            M 50,100 C 150,-50 250,-50 350,100 C 450,250 300,450 200,450 C 100,450 -50,250 50,100 Z
          " />
        </path>

        <!-- Pita 2: Melingkar Halus (Berlawanan Arah) -->
        <path stroke="url(#gradCyan)" color="#00e5ff">
          <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
            M 350,300 C 250,450 150,450 50,300 C -50,150 100,-50 200,-50 C 300,-50 450,150 350,300 Z;
            M 300,350 C 450,250 450,150 300,50 C 150,-50 -50,100 -50,200 C -50,300 150,450 300,350 Z;
            M 350,300 C 250,450 150,450 50,300 C -50,150 100,-50 200,-50 C 300,-50 450,150 350,300 Z
          " />
        </path>

        <!-- Pita 3: Menyilang Tengah -->
        <path stroke="url(#gradGold)" color="#d4a373">
          <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
            M 0,200 C 100,100 300,300 400,200 C 300,100 100,300 0,200 Z;
            M 200,0 C 100,100 300,300 200,400 C 100,300 300,100 200,0 Z;
            M 0,200 C 100,100 300,300 400,200 C 300,100 100,300 0,200 Z
          " />
        </path>
      </svg>

      <!-- Konten Pesan -->
      <div class="card-content">
        <button class="close" id="closeBtn" type="button">&times;</button>
        
        <h2>Hai, Bila</h2>
        <p class="msg" id="msgContainer"></p>
        <p class="signature">— Dari aku, Fitra</p>
      </div>
      
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');

  const bgSunflower = document.getElementById('bgSunflower');
  const overlaySunflower = document.getElementById('overlaySunflower');
  const bgGalaxy = document.getElementById('bgGalaxy');
  const overlayGalaxy = document.getElementById('overlayGalaxy');
  const stars = document.getElementById('starContainer');

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  // Efek Ngetik
  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        let pause = 65; 
        if (/[.,!?]/.test(char)) pause = 250; 
        else if (char === ' ') pause = 80; 
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        typingTimer = setTimeout(typeLine, 300); 
      }
    }
    typeLine();
  }

  // Buka Modal & Transisi Background
  const openCard = () => {
    overlay.classList.add('open');
    
    // Transisi Background
    bgSunflower.style.opacity = '0';
    overlaySunflower.style.opacity = '0';
    bgGalaxy.style.opacity = '1';
    overlayGalaxy.style.opacity = '1';
    stars.style.opacity = '1'; // Munculkan bintang

    setTimeout(typeMessage, 600); 
  };

  // Tutup Modal
  const closeCard = () => {
    overlay.classList.remove('open');
    
    // Kembalikan Background
    bgSunflower.style.opacity = '1';
    overlaySunflower.style.opacity = '1';
    bgGalaxy.style.opacity = '0';
    overlayGalaxy.style.opacity = '0';
    stars.style.opacity = '0';

    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  // Generate Bintang Jatuh
  function createStars() {
    for(let i=0; i<30; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * -100 + 'px';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.animationDelay = (Math.random() * 5) + 's';
      stars.appendChild(star);
    }
  }
  createStars();

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
