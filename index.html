<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4a373; 
    --bg-dark: #020205;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: var(--bg-dark);
  }

  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -6; 
    transition: opacity 1.5s ease;
    opacity: 1;
    animation: kenBurns 25s ease-in-out infinite alternate;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: -5; 
    transition: opacity 1.5s ease;
    opacity: 1;
  }
  
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop'); 
    background-size: cover; background-position: center;
    z-index: -6; 
    transition: opacity 1.5s ease;
    opacity: 0;
    animation: galaxyDrift 40s linear infinite alternate;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(2, 2, 5, 0.3) 0%, rgba(2, 2, 5, 0.9) 100%); 
    z-index: -5; 
    transition: opacity 1.5s ease;
    opacity: 0;
  }

  body.modal-open .bg-sunflower,
  body.modal-open .overlay-sunflower { opacity: 0; }
  
  body.modal-open .bg-galaxy,
  body.modal-open .overlay-galaxy { opacity: 1; }

  @keyframes kenBurns {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.15) translate(-2%, -2%); }
  }
  @keyframes galaxyDrift {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.1) translate(2%, 2%); }
  }

  .saturn-system {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -60%) scale(0.8);
    width: 400px; height: 400px;
    perspective: 1200px;
    z-index: -2;
    opacity: 0; 
    transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
  }
  
  body.modal-open .saturn-system { 
    opacity: 1; 
    transform: translate(-50%, -60%) scale(1);
  }

  .planet-wrap {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: floatPlanet 6s ease-in-out infinite alternate;
  }

  .planet-body {
    position: absolute; top: 50%; left: 50%;
    width: 160px; height: 160px;
    margin: -80px 0 0 -80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 40%), 
                repeating-linear-gradient(0deg, #fff2d9 0%, #e6b981 10%, #a86e36 20%, #4a2208 30%, #0d0400 40%);
    background-size: 100% 200%;
    box-shadow: inset -20px -20px 50px rgba(0,0,0,1);
    z-index: 10;
    animation: planetSurface 15s linear infinite;
  }

  .planet-atmosphere {
    position: absolute; top: 50%; left: 50%;
    width: 170px; height: 170px;
    margin: -85px 0 0 -85px;
    border-radius: 50%;
    box-shadow: 0 0 50px 15px rgba(230, 185, 129, 0.4), inset 0 0 20px rgba(230, 185, 129, 0.3);
    z-index: 9;
    animation: pulseAtmosphere 4s ease-in-out infinite alternate;
  }

  .rings-container {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(75deg) rotateY(-20deg) rotateZ(0deg);
    animation: spinRings 20s linear infinite;
    z-index: 5;
  }

  .ring { position: absolute; border-radius: 50%; top: 50%; left: 50%; }
  .ring-outer {
    width: 360px; height: 360px; margin: -180px 0 0 -180px;
    border: 12px solid rgba(230, 185, 129, 0.2);
    box-shadow: 0 0 20px rgba(230, 185, 129, 0.2), inset 0 0 20px rgba(230, 185, 129, 0.2);
  }
  .ring-mid {
    width: 290px; height: 290px; margin: -145px 0 0 -145px;
    border: 20px solid rgba(255, 242, 217, 0.4);
    box-shadow: 0 0 15px rgba(255, 242, 217, 0.3);
  }
  .ring-inner {
    width: 210px; height: 210px; margin: -105px 0 0 -105px;
    border: 8px solid rgba(168, 110, 54, 0.6);
  }

  .moon-orbit-1 {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px;
    margin: -130px 0 0 -130px;
    transform: rotateX(70deg) rotateY(15deg) rotateZ(30deg);
    transform-style: preserve-3d;
    animation: orbitMoon1 8s linear infinite;
    z-index: 15;
  }
  .moon-orbit-2 {
    position: absolute; top: 50%; left: 50%;
    width: 320px; height: 320px;
    margin: -160px 0 0 -160px;
    transform: rotateX(60deg) rotateY(-20deg) rotateZ(-45deg);
    transform-style: preserve-3d;
    animation: orbitMoon2 12s linear infinite;
    z-index: 4;
  }
  
  .moon-1 {
    position: absolute; top: -6px; left: 50%;
    width: 14px; height: 14px; margin-left: -7px;
    background: radial-gradient(circle at 30% 30%, #fff, #999);
    border-radius: 50%;
    box-shadow: 0 0 15px #fff;
  }
  .moon-2 {
    position: absolute; bottom: -4px; left: 50%;
    width: 8px; height: 8px; margin-left: -4px;
    background: #bbb;
    border-radius: 50%;
    box-shadow: 0 0 8px #bbb;
  }

  @keyframes planetSurface {
    0% { background-position: 0% 0%; }
    100% { background-position: 0% 200%; }
  }
  @keyframes pulseAtmosphere {
    0% { box-shadow: 0 0 40px 10px rgba(230, 185, 129, 0.3); }
    100% { box-shadow: 0 0 60px 20px rgba(230, 185, 129, 0.6); }
  }
  @keyframes spinRings {
    0% { transform: rotateX(75deg) rotateY(-20deg) rotateZ(0deg); }
    100% { transform: rotateX(75deg) rotateY(-20deg) rotateZ(360deg); }
  }
  @keyframes floatPlanet {
    0% { transform: translateY(0px) rotateZ(0deg); }
    100% { transform: translateY(-20px) rotateZ(2deg); }
  }
  @keyframes orbitMoon1 {
    0% { transform: rotateX(70deg) rotateY(15deg) rotateZ(0deg); }
    100% { transform: rotateX(70deg) rotateY(15deg) rotateZ(360deg); }
  }
  @keyframes orbitMoon2 {
    0% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(0deg); }
    100% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(-360deg); }
  }

  .stars-bg {
    position: absolute; inset: 0; z-index: -3;
    pointer-events: none; opacity: 0; transition: opacity 2s ease;
  }
  body.modal-open .stars-bg { opacity: 1; }

  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }
  .shooting-star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff;
    animation: shoot 4s linear infinite;
  }

  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px #fff; }
  }
  @keyframes shoot {
    0% { transform: translateY(-50px) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh) translateX(-200px); opacity: 0; }
  }

  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: opacity 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1; 
    color: #1a1a1a; margin-bottom: 15px;
    text-shadow: 0 4px 20px rgba(255,255,255,1);
    animation: floatText 4s ease-in-out infinite alternate;
  }
  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,1);
    margin-bottom: 50px;
    animation: floatText 5s ease-in-out infinite alternate 1s;
  }

  @keyframes floatText {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-8px); }
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: pulseBtn 2s ease-in-out infinite alternate;
  }
  .btn:hover { background: var(--accent); transform: scale(1.05); }

  @keyframes pulseBtn {
    0% { box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 0px rgba(212,163,115,0); transform: translateY(0); }
    100% { box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 20px rgba(212,163,115,0.6); transform: translateY(-5px); }
  }

  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .card-content {
    position: relative;
    width: min(460px, 100%);
    max-height: 85vh; overflow-y: auto;
    padding: 50px 30px; text-align: center;
    
    background: linear-gradient(rgba(10, 10, 20, 0.6), rgba(5, 5, 10, 0.9)), 
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
    backdrop-filter: blur(10px); 
    -webkit-backdrop-filter: blur(10px);
    
    border-radius: 24px; 
    border: 1px solid rgba(212, 163, 115, 0.5);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.6);
    
    transform: translateY(30px) scale(0.95); opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    z-index: 10; 
  }

  .overlay.open .card-content { 
    transform: translateY(0) scale(1); opacity: 1; 
    animation: floatCard 6s ease-in-out infinite alternate 1s; 
  }

  .card-content::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 24px;
    background: linear-gradient(45deg, transparent 20%, rgba(212, 163, 115, 0.8) 50%, transparent 80%);
    background-size: 200% 200%;
    z-index: -1;
    animation: borderShine 3s linear infinite;
  }

  @keyframes floatCard {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-10px); }
  }
  @keyframes borderShine {
    0% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  .close {
    position: absolute; top: 15px; right: 15px; z-index: 20;
    width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: var(--accent); color: #111; transform: rotate(90deg); }

  .card-content h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.4rem; color: var(--accent); margin-bottom: 25px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }

  .card-content p.msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem; 
    line-height: 1.8; 
    font-weight: 400;
    color: #fff; 
    text-shadow: 0 2px 8px rgba(0,0,0,1);
    display: flex; flex-direction: column;
    min-height: 1em; 
    letter-spacing: -0.5px;
    text-align: left; 
  }

  .msg-line {
    display: block; min-height: 1.5em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block; 
    width: 9px; 
    height: 1.1em;
    background: var(--accent); 
    margin-left: 2px;
    vertical-align: -2px; 
    animation: blink 0.8s steps(1) infinite;
    box-shadow: 0 0 10px var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.4rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    animation: fadeUp 1s ease 4s forwards;
    text-align: right;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .music-control {
    position: fixed; bottom: 30px; left: 30px; z-index: 100;
    width: 45px; height: 45px;
    background: rgba(10, 10, 15, 0.6);
    border: 1px solid rgba(212, 163, 115, 0.5);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    opacity: 0; pointer-events: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  body.modal-open .music-control {
    opacity: 1; pointer-events: auto;
  }
  .music-control:hover {
    transform: scale(1.1);
    border-color: var(--accent);
  }
  .music-control svg {
    width: 20px; height: 20px;
    fill: var(--accent);
  }
  .music-control.playing {
    animation: pulseMusic 2s infinite alternate;
  }
  @keyframes pulseMusic {
    0% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.4); }
    100% { box-shadow: 0 0 0 10px rgba(212, 163, 115, 0); }
  }

  @media (max-width: 480px) {
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .card-content p.msg { font-size: 0.95rem; }
    .saturn-system { transform: translate(-50%, -60%) scale(0.55); }
    body.modal-open .saturn-system { transform: translate(-50%, -60%) scale(0.7); }
    .card-content { padding: 40px 20px; }
    .music-control { bottom: 20px; left: 20px; width: 40px; height: 40px; }
  }
</style>
</head>
<body>

  <!-- LAGU: Lobo - Rock and Roll Days (Direct Link) -->
  <audio id="bgMusic" loop>
    <source src="https://archive.org/download/lobo_20250503/Lobo.mp3" type="audio/mpeg">
  </audio>

  <!-- Tombol Kontrol Musik -->
  <div class="music-control playing" id="musicBtn">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </div>

  <div class="bg-sunflower"></div>
  <div class="overlay-sunflower"></div>
  <div class="bg-galaxy"></div>
  <div class="overlay-galaxy"></div>
  
  <div class="stars-bg" id="starContainer"></div>

  <div class="saturn-system">
    <div class="planet-wrap">
      <div class="planet-atmosphere"></div>
      <div class="moon-orbit-2"><div class="moon-2"></div></div>
      <div class="rings-container">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
      </div>
      <div class="moon-orbit-1"><div class="moon-1"></div></div>
      <div class="planet-body"></div>
    </div>
  </div>

  <main class="stage" id="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card-content">
      <button class="close" id="closeBtn" type="button">&times;</button>
      
      <h2>Hai, Bila</h2>
      <p class="msg" id="msgContainer"></p>
      <p class="signature">— Dari aku, Fitra</p>
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');
  const stage = document.getElementById('stage');

  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  let isMusicPlaying = false;

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        let pause = 70 + Math.random() * 40; 
        if (/[.,!?]/.test(char)) pause = 350 + Math.random() * 100; 
        else if (char === ' ') pause = 120 + Math.random() * 50; 
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        typingTimer = setTimeout(typeLine, 400); 
      }
    }
    typeLine();
  }

  const openCard = () => {
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    
    stage.style.opacity = '0';
    stage.style.pointerEvents = 'none';

    bgMusic.volume = 0.6;
    bgMusic.play().then(() => {
      isMusicPlaying = true;
      musicBtn.classList.add('playing');
    }).catch(err => {
      console.log("Lagu gagal diputar otomatis oleh browser", err);
    });

    setTimeout(typeMessage, 1000); 
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    
    stage.style.opacity = '1';
    stage.style.pointerEvents = 'auto';

    bgMusic.pause();
    bgMusic.currentTime = 0;
    isMusicPlaying = false;
    musicBtn.classList.remove('playing');

    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  musicBtn.addEventListener('click', () => {
    if (isMusicPlaying) {
      bgMusic.pause();
      musicBtn.classList.remove('playing');
      isMusicPlaying = false;
    } else {
      bgMusic.play();
      musicBtn.classList.add('playing');
      isMusicPlaying = true;
    }
  });

  function createStars() {
    const container = document.getElementById('starContainer');
    for(let i=0; i<80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
      star.style.animationDelay = (Math.random() * 2) + 's';
      container.appendChild(star);
    }
    for(let i=0; i<15; i++) {
      const shootingStar = document.createElement('div');
      shootingStar.className = 'shooting-star';
      shootingStar.style.left = Math.random() * 100 + 'vw';
      shootingStar.style.top = (Math.random() * -50) + 'px';
      shootingStar.style.animationDuration = (Math.random() * 3 + 2) + 's';
      shootingStar.style.animationDelay = (Math.random() * 6) + 's';
      container.appendChild(shootingStar);
    }
  }
  createStars();

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
