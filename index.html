<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4a373; 
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: #000;
  }

  /* =========================================
     BACKGROUND HALAMAN (MATAHARI -> GALAKSI)
     ========================================= */
  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 1;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.3); 
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: -3; transition: opacity 1.5s ease;
    opacity: 1;
  }
  
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop'); 
    background-size: cover; background-position: center;
    z-index: -4; transition: opacity 1.5s ease;
    opacity: 0;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: rgba(10, 10, 25, 0.4); 
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: -3; transition: opacity 1.5s ease;
    opacity: 0;
  }

  /* =========================================
     HALAMAN UTAMA
     ========================================= */
  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1; 
    color: #1a1a1a; margin-bottom: 15px;
    text-shadow: 0 4px 20px rgba(255,255,255,1);
  }

  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,1);
    margin-bottom: 50px;
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px); }

  /* =========================================
     POP-UP MODAL 
     ========================================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* WADAH KARTU */
  .card-wrapper {
    position: relative;
    width: min(450px, 100%);
    display: grid; place-items: center;
    border-radius: 20px;
  }

  /* =========================================
     KARTU PESAN (ISI GALAKSI)
     ========================================= */
  .card-content {
    position: relative;
    width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 60px 40px; text-align: center;
    
    /* ISI GALAKSI */
    background: linear-gradient(rgba(10, 10, 20, 0.5), rgba(10, 10, 20, 0.8)), 
                url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
    
    border-radius: 20px; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    
    transform: translateY(30px) scale(0.95); opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    z-index: 10; /* Di bawah benang */
  }
  .overlay.open .card-content { transform: translateY(0) scale(1); opacity: 1; }

  /* Teks di dalam kartu (di atas benang) */
  .inner-text {
    position: relative;
    z-index: 20;
  }

  /* =========================================
     BENANG LIAR SEBAGAI BINGKAI (BORDER)
     ========================================= */
  .thread-svg {
    position: absolute;
    inset: -20px; /* Menjangkau keluar dari kotak */
    width: calc(100% + 40px); height: calc(100% + 40px);
    z-index: 15; pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease 0.3s;
  }
  .overlay.open .thread-svg { opacity: 1; }

  .thread-svg path {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px currentColor); 
    /* Ini memastikan ketebalan benang tetap stabil di HP */
    vector-effect: non-scaling-stroke; 
  }

  /* Tombol Close */
  .close {
    position: absolute; top: 15px; right: 15px; z-index: 30;
    width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: #fff; color: #111; transform: rotate(90deg); }

  /* =========================================
     TEKS & ANIMASI KETIK
     ========================================= */
  .card-content h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.2rem; color: var(--accent); margin-bottom: 25px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .card-content p.msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem; line-height: 1.7; font-style: italic; font-weight: 400;
    color: #fff; 
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: 0.5px;
  }

  .msg-line {
    display: block; min-height: 1.2em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.4rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    animation: fadeUp 1s ease 4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card-content { padding: 50px 25px; }
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .card-content p.msg { font-size: 1.2rem; }
    .thread-svg {
      inset: -15px;
      width: calc(100% + 30px); height: calc(100% + 30px);
    }
  }
</style>
</head>
<body>

  <!-- Background Halaman -->
  <div class="bg-sunflower" id="bgSunflower"></div>
  <div class="overlay-sunflower" id="overlaySunflower"></div>
  <div class="bg-galaxy" id="bgGalaxy"></div>
  <div class="overlay-galaxy" id="overlayGalaxy"></div>

  <!-- Halaman Utama -->
  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <!-- Pop-up Card -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card-wrapper">
      
      <!-- SVG BENANG LIAR -->
      <svg class="thread-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gPink" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff7eb3"/><stop offset="100%" stop-color="#ff758c"/></linearGradient>
          <linearGradient id="gCyan" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0072ff"/></linearGradient>
          <linearGradient id="gGold" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#d4a373"/><stop offset="100%" stop-color="#faedcd"/></linearGradient>
        </defs>

        <!-- Benang 1: Pink (Liar) -->
        <path stroke="url(#gPink)" color="#ff7eb3">
          <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
            M 0,0 C 50,-40 100,-10 100,10 C 120,50 80,80 100,90 C 100,130 50,120 10,100 C -20,80 -20,20 0,0;
            M 0,0 C 60,-20 80,-20 100,10 C 100,40 100,60 100,90 C 80,110 60,110 10,100 C -10,100 0,20 0,0;
            M 0,0 C 30,-50 110,0 100,10 C 130,30 70,70 100,90 C 120,100 40,140 10,100 C -30,60 -10,40 0,0;
            M 0,0 C 50,-40 100,-10 100,10 C 120,50 80,80 100,90 C 100,130 50,120 10,100 C -20,80 -20,20 0,0
          " />
        </path>

        <!-- Benang 2: Cyan (Liar) -->
        <path stroke="url(#gCyan)" color="#00e5ff">
          <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
            M 100,0 C 60,-30 20,20 0,0 C -20,40 20,80 0,90 C 0,120 40,120 90,100 C 120,80 110,20 100,0;
            M 100,0 C 80,-40 30,10 0,0 C -30,20 30,70 0,90 C -10,100 60,140 90,100 C 110,90 120,10 100,0;
            M 100,0 C 40,-20 10,30 0,0 C -10,60 10,60 0,90 C 10,110 20,130 90,100 C 130,70 100,30 100,0;
            M 100,0 C 60,-30 20,20 0,0 C -20,40 20,80 0,90 C 0,120 40,120 90,100 C 120,80 110,20 100,0
          " />
        </path>

        <!-- Benang 3: Emas (Liar) -->
        <path stroke="url(#gGold)" color="#d4a373">
          <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
            M 0,10 C 40,-20 60,40 100,10 C 110,60 90,40 100,90 C 60,120 40,80 0,90 C -10,50 20,40 0,10;
            M 0,10 C 60,-30 50,60 100,10 C 130,40 70,60 100,90 C 40,130 60,60 0,90 C -30,70 10,20 0,10;
            M 0,10 C 20,-30 80,20 100,10 C 90,70 100,20 100,90 C 80,100 20,100 0,90 C 10,60 -20,50 0,10;
            M 0,10 C 40,-20 60,40 100,10 C 110,60 90,40 100,90 C 60,120 40,80 0,90 C -10,50 20,40 0,10
          " />
        </path>
      </svg>

      <!-- Kotak Galaksi -->
      <div class="card-content">
        <button class="close" id="closeBtn" type="button">&times;</button>
        
        <!-- Pembungkus Teks -->
        <div class="inner-text">
          <h2>Hai, Bila</h2>
          <p class="msg" id="msgContainer"></p>
          <p class="signature">— Dari aku, Fitra</p>
        </div>
      </div>
      
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');

  const bgSunflower = document.getElementById('bgSunflower');
  const overlaySunflower = document.getElementById('overlaySunflower');
  const bgGalaxy = document.getElementById('bgGalaxy');
  const overlayGalaxy = document.getElementById('overlayGalaxy');

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        let pause = 65; 
        if (/[.,!?]/.test(char)) pause = 250; 
        else if (char === ' ') pause = 80; 
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        typingTimer = setTimeout(typeLine, 300); 
      }
    }
    typeLine();
  }

  const openCard = () => {
    overlay.classList.add('open');
    bgSunflower.style.opacity = '0';
    overlaySunflower.style.opacity = '0';
    bgGalaxy.style.opacity = '1';
    overlayGalaxy.style.opacity = '1';
    setTimeout(typeMessage, 600); 
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    bgSunflower.style.opacity = '1';
    overlaySunflower.style.opacity = '1';
    bgGalaxy.style.opacity = '0';
    overlayGalaxy.style.opacity = '0';
    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
