<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font Klasik & Minimalis -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text-main: #2c2c2c; 
    --text-sub: #7a7a7a;
    --gold: #d49a37; /* Warna emas yang sedikit lebih hangat, mendekati kuning bunga matahari */
    --card-bg: #ffffff;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Montserrat', sans-serif;
    color: var(--text-main);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    
    /* BACKGROUND BUNGA MATAHARI */
    /* Gambar ladang bunga matahari + overlay putih transparan agar elegan & teks terbaca */
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.85)),
      url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* Halaman Utama */
  .stage {
    text-align: center;
    padding: 24px;
    z-index: 1;
    animation: fadeIn 1.5s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 4.5rem);
    font-weight: 600;
    font-style: italic;
    line-height: 1.2;
    color: #1a1a1a;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.8);
  }

  .subtitle {
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.75rem;
    color: var(--text-main);
    margin-bottom: 50px;
  }

  /* Tombol Minimalis Elegan */
  .btn {
    position: relative;
    background: rgba(255, 255, 255, 0.9);
    color: var(--text-main);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 15px 45px;
    border: 1px solid var(--gold);
    border-radius: 0; 
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .btn:hover {
    background: var(--gold);
    color: #fff;
    box-shadow: 0 10px 20px rgba(212, 154, 55, 0.3);
  }

  /* Overlay Pop-up */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    background: rgba(30, 30, 30, 0.4); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* Kartu Putih */
  .card {
    position: relative;
    width: min(450px, 100%);
    max-height: 85vh; overflow-y: auto;
    padding: 60px 40px;
    text-align: center;
    background: var(--card-bg);
    border-radius: 8px; /* Sedikit lebih rounded agar manis */
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    transform: translateY(20px) scale(0.98);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
  }
  .overlay.open .card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  /* Garis emas tipis di dalam kartu */
  .card::before {
    content: '';
    position: absolute; inset: 15px;
    border: 1px solid rgba(212, 154, 55, 0.3);
    pointer-events: none;
    border-radius: 4px;
  }

  .close {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    width: 30px; height: 30px;
    border: none; background: transparent;
    color: #a0a0a0;
    font-size: 1.5rem; line-height: 1;
    cursor: pointer;
    transition: 0.3s;
  }
  .close:hover {
    color: var(--text-main);
    transform: rotate(90deg);
  }

  /* --- TAMPILAN DEPAN (AMPLOP) --- */
  .envelope-icon {
    font-size: 2.5rem;
    color: var(--gold);
    margin-bottom: 25px;
    display: inline-block;
  }

  .front-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-style: italic;
    color: var(--text-main);
    margin-bottom: 10px;
  }

  .btn-inner {
    margin-top: 30px;
    padding: 12px 35px;
    background: var(--text-main);
    border: 1px solid var(--text-main);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn-inner:hover {
    background: transparent;
    color: var(--text-main);
  }

  /* --- TAMPILAN BELAKANG (PESAN) --- */
  .card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-style: italic;
    color: var(--text-main);
    margin-bottom: 25px;
  }

  .card p.msg {
    font-size: 1rem;
    line-height: 1.8;
    font-weight: 300;
    color: #4a4a4a;
    white-space: pre-wrap;
    min-height: 1em;
  }

  .type-cursor {
    display: inline-block; width: 2px; height: 1.1em;
    background: var(--gold); margin-left: 3px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--gold);
    margin-top: 35px;
    opacity: 0;
    animation: fadeUp 1s ease 2.5s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card { padding: 50px 25px; }
    .card::before { inset: 10px; }
  }
</style>
</head>
<body>

  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">Sebuah Pesan Kecil</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card" id="card">
      <button class="close" id="closeBtn" type="button" aria-label="Tutup">&times;</button>
      
      <!-- TAMPILAN DEPAN (SEBELUM DIKLIK) -->
      <div id="cardFront">
        <div class="envelope-icon">&#9993;</div>
        <h2 class="front-title">Ada Pesan</h2>
        <p style="color: var(--text-sub); font-size: 0.85rem; letter-spacing: 1px;">Khusus untukmu</p>
        <button class="btn-inner" id="revealBtn">Buka</button>
      </div>

      <!-- TAMPILAN BELAKANG (ISI PESAN) -->
      <div id="cardBack" style="display: none;">
        <h2 id="cardTitle">Hai, Bila</h2>
        <p class="msg" id="msgText"></p>
        <p class="signature">— Dari aku</p>
      </div>

    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgEl    = document.getElementById('msgText');
  
  const cardFront = document.getElementById('cardFront');
  const cardBack  = document.getElementById('cardBack');
  const revealBtn = document.getElementById('revealBtn');

  // ==========================================
  // TEKS PESAN
  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏';
  // ==========================================

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
    let i = 0;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    msgEl.appendChild(cursor);

    function step() {
      if (i < MESSAGE.length) {
        const ch = MESSAGE[i];
        if (ch === '\n') {
          cursor.before(document.createElement('br'));
        } else {
          cursor.before(document.createTextNode(ch));
        }
        i++;
        const pause = /[.,!?]/.test(ch) ? 150 : 40; 
        typingTimer = setTimeout(step, pause);
      } else {
        setTimeout(() => cursor.remove(), 1500);
      }
    }
    step();
  }

  const openCard = () => {
    overlay.classList.add('open');
    cardFront.style.display = 'block';
    cardBack.style.display = 'none';
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    clearTimeout(typingTimer);
  };

  openBtn.addEventListener('click', openCard);

  revealBtn.addEventListener('click', () => {
    cardFront.style.display = 'none'; 
    cardBack.style.display = 'block'; 
    typeMessage();                    
  });

  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

</script>
</body>
</html>
