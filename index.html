<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4a373; 
    --bg-dark: #020205;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: var(--bg-dark);
  }

  /* =========================================
     BACKGROUND TRANSISI (MATAHARI -> GALAKSI)
     ========================================= */
  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -6; transition: opacity 1.5s ease;
    opacity: 1;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: -5; transition: opacity 1.5s ease;
    opacity: 1;
  }
  
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop'); 
    background-size: cover; background-position: center;
    z-index: -6; transition: opacity 1.5s ease;
    opacity: 0;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: rgba(2, 2, 5, 0.4); 
    z-index: -5; transition: opacity 1.5s ease;
    opacity: 0;
  }

  /* =========================================
     SATURNUS 3D BERPUTAR
     ========================================= */
  .saturn-system {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 400px; height: 400px;
    perspective: 1200px;
    z-index: -2;
    opacity: 0; transition: opacity 2s ease;
    /* Animasi planet melayang */
    animation: planetFloat 8s ease-in-out infinite alternate;
  }
  body.modal-open .saturn-system { opacity: 1; }

  .planet {
    position: absolute; top: 50%; left: 50%;
    width: 160px; height: 160px;
    margin: -80px 0 0 -80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff7e6, #d4a373, #6b3e1b, #1a0a02);
    box-shadow: inset -20px -20px 50px rgba(0,0,0,1), 0 0 60px rgba(212, 163, 115, 0.4);
    z-index: 2;
  }

  .ring-group {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(75deg) rotateY(-15deg) rotateZ(0deg);
    /* Animasi cincin berputar */
    animation: spinRings 15s linear infinite;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgba(212,163,115,0.1) 0%,
      rgba(255, 230, 200, 0.8) 25%,
      rgba(212,163,115,0.1) 50%,
      rgba(212,163,115,0.5) 75%,
      rgba(212,163,115,0.1) 100%
    );
  }

  .ring-1 {
    width: 380px; height: 380px; margin: -190px 0 0 -190px;
    -webkit-mask: radial-gradient(transparent 62%, #000 63%, #000 100%);
    mask: radial-gradient(transparent 62%, #000 63%, #000 100%);
  }
  .ring-2 {
    width: 310px; height: 310px; margin: -155px 0 0 -155px;
    -webkit-mask: radial-gradient(transparent 68%, #000 69%, #000 100%);
    mask: radial-gradient(transparent 68%, #000 69%, #000 100%);
  }
  .ring-3 {
    width: 250px; height: 250px; margin: -125px 0 0 -125px;
    -webkit-mask: radial-gradient(transparent 72%, #000 73%, #000 100%);
    mask: radial-gradient(transparent 72%, #000 73%, #000 100%);
  }

  @keyframes spinRings {
    0% { transform: rotateX(75deg) rotateY(-15deg) rotateZ(0deg); }
    100% { transform: rotateX(75deg) rotateY(-15deg) rotateZ(360deg); }
  }
  @keyframes planetFloat {
    0% { transform: translate(-50%, -50%) scale(0.8) translateY(0px); }
    100% { transform: translate(-50%, -50%) scale(0.8) translateY(-15px); }
  }

  /* =========================================
     EFEK BINTANG JATUH
     ========================================= */
  .stars {
    position: absolute; inset: 0; z-index: -3;
    pointer-events: none; opacity: 0; transition: opacity 2s ease;
  }
  body.modal-open .stars { opacity: 1; }
  
  .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff;
    animation: shootingStar linear infinite;
  }
  @keyframes shootingStar {
    0% { transform: translateY(-100px) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh) translateX(-150px); opacity: 0; }
  }

  /* =========================================
     HALAMAN UTAMA
     ========================================= */
  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1; 
    color: #1a1a1a; margin-bottom: 15px;
    text-shadow: 0 4px 20px rgba(255,255,255,1);
  }

  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,1);
    margin-bottom: 50px;
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px); }

  /* =========================================
     OVERLAY & TEKS MELAYANG (TANPA KARTU)
     ========================================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* Teks melayang langsung di luar angkasa */
  .message-container {
    position: relative;
    width: min(460px, 100%);
    padding: 40px 20px; 
    text-align: center;
    z-index: 10;
  }

  /* Tombol Close */
  .close {
    position: absolute; top: -20px; right: 10px; z-index: 20;
    width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(5px);
  }
  .close:hover { background: #fff; color: #111; transform: rotate(90deg); }

  /* =========================================
     TIPOGRAFI & ANIMASI
     ========================================= */
  .message-container h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.6rem; color: var(--accent); margin-bottom: 25px;
    text-shadow: 0 4px 15px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,0.8);
  }

  .message-container p.msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; line-height: 1.8; font-style: italic; font-weight: 400;
    color: #fff; 
    /* Bayangan teks ekstra kuat agar tetap terbaca di atas planet/galaksi */
    text-shadow: 0 2px 10px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,0.8);
    display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: 0.5px;
  }

  .msg-line {
    display: block; min-height: 1.2em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px; animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.6rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,1);
    animation: fadeUp 1s ease 4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile Settings */
  @media (max-width: 480px) {
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .message-container p.msg { font-size: 1.3rem; }
    .saturn-system { transform: translate(-50%, -50%) scale(0.55); }
    @keyframes planetFloat {
      0% { transform: translate(-50%, -50%) scale(0.55) translateY(0px); }
      100% { transform: translate(-50%, -50%) scale(0.55) translateY(-10px); }
    }
  }
</style>
</head>
<body>

  <!-- Background Layer -->
  <div class="bg-sunflower"></div>
  <div class="overlay-sunflower"></div>
  <div class="bg-galaxy"></div>
  <div class="overlay-galaxy"></div>
  
  <!-- Planet Saturnus 3D -->
  <div class="saturn-system">
    <div class="ring-group">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <div class="planet"></div>
  </div>

  <!-- Bintang Jatuh -->
  <div class="stars" id="starContainer"></div>

  <!-- Halaman Utama -->
  <main class="stage" id="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <!-- Pop-up Teks -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    
    <div class="message-container">
      <button class="close" id="closeBtn" type="button">&times;</button>
      
      <h2>Hai, Bila</h2>
      <p class="msg" id="msgContainer"></p>
      <p class="signature">— Dari aku, Fitra</p>
    </div>
    
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');
  const stage = document.getElementById('stage');

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  // Efek Ngetik
  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        let pause = 65; 
        if (/[.,!?]/.test(char)) pause = 250; 
        else if (char === ' ') pause = 80; 
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        typingTimer = setTimeout(typeLine, 300); 
      }
    }
    typeLine();
  }

  // Buka Modal (Transisi Background & Saturnus)
  const openCard = () => {
    overlay.classList.add('open');
    
    // Memicu transisi background galaksi dan saturnus lewat class body
    document.body.classList.add('modal-open');

    setTimeout(typeMessage, 800); 
  };

  // Tutup Modal
  const closeCard = () => {
    overlay.classList.remove('open');
    
    // Kembalikan ke bunga matahari
    document.body.classList.remove('modal-open');

    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  // Generate Bintang Jatuh
  function createStars() {
    const starsContainer = document.getElementById('starContainer');
    for(let i=0; i<40; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = (Math.random() * -100) + 'px';
      star.style.animationDuration = (Math.random() * 4 + 3) + 's';
      star.style.animationDelay = (Math.random() * 5) + 's';
      starsContainer.appendChild(star);
    }
  }
  createStars();

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
