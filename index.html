<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font Modern & Elegan -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text-main: #1f1f1f; 
    --text-muted: #6b6b6b;
    --accent: #d4a373; 
    --bg-card: #ffffff;
  }

  html, body { height: 100%; }

  body {
    /* Ditambahkan font emoji agar selalu terbaca jelas */
    font-family: 'Plus Jakarta Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    color: var(--text-main);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: #f4f1ea;
  }

  /* Background Zoom Halus */
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    z-index: -2;
    animation: bgZoom 25s ease-in-out infinite alternate;
  }
  @keyframes bgZoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    z-index: -1;
  }

  /* Halaman Utama */
  .stage {
    text-align: center;
    padding: 24px;
    z-index: 1;
    animation: fadeIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5rem);
    font-weight: 600;
    line-height: 1.1;
    color: #111;
    margin-bottom: 12px;
  }

  .subtitle {
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 45px;
  }

  .btn {
    background: #111;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 18px 45px;
    border: none;
    border-radius: 4px; 
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }
  .btn:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(212, 163, 115, 0.3);
  }

  /* Pop-up Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    background: rgba(20, 20, 20, 0.4); 
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* Kartu */
  .card {
    position: relative;
    width: min(480px, 100%);
    max-height: 88vh; overflow-y: auto;
    padding: 60px 40px;
    text-align: center;
    background: var(--bg-card);
    border-radius: 8px; 
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    transform: translateY(30px) scale(0.95);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
  }
  .overlay.open .card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .card-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    border-radius: 8px 8px 0 0;
  }

  .close {
    position: absolute; top: 20px; right: 20px;
    width: 36px; height: 36px;
    border: none; background: #f5f5f5;
    border-radius: 50%;
    color: #888;
    font-size: 1.2rem; line-height: 1;
    cursor: pointer;
    transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover {
    background: #e0e0e0; color: #111;
  }

  .card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--text-main);
    margin-bottom: 20px;
  }

  .card p.msg {
    font-size: 1.05rem;
    line-height: 1.9;
    font-weight: 400;
    color: #4a4a4a;
    white-space: pre-wrap;
    min-height: 1em;
  }

  .type-cursor {
    display: inline-block; width: 2px; height: 1.1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--accent);
    margin-top: 35px;
    opacity: 0;
    animation: fadeUp 1s ease 3s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card { padding: 50px 25px; }
  }
</style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <div class="card-accent"></div>
      <button class="close" id="closeBtn" type="button">&times;</button>
      
      <h2>Hai, Bila</h2>
      <p class="msg" id="msgText"></p>
      <p class="signature">— Dari aku</p>

    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgEl    = document.getElementById('msgText');

  // ==========================================
  // TEKS PESAN
  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nDoaku selalu, semoga hal-hal baik selalu menyertai kita.';
  // ==========================================

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
    let i = 0;

    // KUNCI PERBAIKAN: Menggunakan Array.from agar Emoji tidak terpotong
    const characters = Array.from(MESSAGE);

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    msgEl.appendChild(cursor);

    function step() {
      if (i < characters.length) {
        const ch = characters[i];
        
        if (ch === '\n') {
          cursor.before(document.createElement('br'));
        } else {
          cursor.before(document.createTextNode(ch));
        }
        i++;
        
        const pause = /[.,!?]/.test(ch) ? 150 : 35; 
        typingTimer = setTimeout(step, pause);
      } else {
        setTimeout(() => cursor.remove(), 1500);
      }
    }
    step();
  }

  const openCard = () => {
    overlay.classList.add('open');
    typeMessage(); 
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    clearTimeout(typingTimer);
    setTimeout(() => { msgEl.innerHTML = ''; }, 500); 
  };

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

</script>
</body>
</html>
