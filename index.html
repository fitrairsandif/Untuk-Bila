<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untukmu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #4a3b3f;
    --gold: #c8a165;
    --rose: #b5757f;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 15%, #fff8f1 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, #f3e2ee 0%, transparent 55%),
      linear-gradient(150deg, #fdf7f1 0%, #f8e8e6 50%, #efe2ec 100%);
    background-size: 200% 200%;
    animation: gradientShift 18s ease-in-out infinite;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ---------- Kelopak melayang ---------- */
  .petals {
    position: fixed; inset: 0;
    overflow: hidden; pointer-events: none; z-index: 0;
  }
  .petals span {
    position: absolute;
    bottom: -12%;
    color: rgba(181, 117, 127, .38);
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(.8);      opacity: 0; }
    12%  {                                                        opacity: .9; }
    88%  {                                                        opacity: .5; }
    100% { transform: translateY(-118vh) rotate(340deg) scale(1.1); opacity: 0; }
  }

  /* ---------- Halaman utama ---------- */
  .stage {
    position: relative; z-index: 1;
    text-align: center; padding: 24px;
    animation: fadeIn 1.6s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: .78rem; letter-spacing: .42em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 18px;
    animation: fadeIn 1.2s ease .2s both;
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.8rem, 9vw, 4.5rem);
    font-weight: 400; line-height: 1.1; color: #5c464c;
    animation: fadeIn 1.4s ease .35s both, glowPulse 4s ease-in-out 2s infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 0 rgba(200,161,101,0); }
    50%      { text-shadow: 0 0 24px rgba(200,161,101,.35); }
  }

  .subtitle {
    font-style: italic;
    font-size: clamp(1rem, 3vw, 1.18rem);
    color: #8a7079; margin-top: 10px;
    animation: fadeIn 1.4s ease .55s both;
  }

  .rule {
    width: 90px; height: 1px; margin: 28px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: ruleGrow 1.2s ease .7s both;
  }
  @keyframes ruleGrow {
    from { width: 0; opacity: 0; }
    to   { width: 90px; opacity: 1; }
  }

  .btn {
    position: relative; isolation: isolate; overflow: hidden;
    background: transparent;
    border: 1px solid var(--gold);
    color: #5c464c;
    font-family: inherit;
    font-size: .95rem; letter-spacing: .2em;
    text-transform: uppercase;
    padding: 15px 38px; border-radius: 999px;
    cursor: pointer;
    transition: color .45s ease, letter-spacing .45s ease;
    animation: fadeIn 1.4s ease .85s both, btnFloat 3.4s ease-in-out 2s infinite;
  }
  @keyframes btnFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .btn::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    transform: scaleX(0); transform-origin: left center;
    transition: transform .55s cubic-bezier(.2, .8, .2, 1);
  }
  .btn:hover { color: #fff; letter-spacing: .26em; }
  .btn:hover::before { transform: scaleX(1); }
  .btn:active { transform: scale(.97); }

  /* ---------- Overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    background: rgba(58, 42, 48, .34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* ---------- Kartu pesan ---------- */
  .card {
    position: relative;
    width: min(520px, 100%);
    max-height: 88vh; overflow-y: auto;
    padding: 52px 42px 42px;
    text-align: center;
    border-radius: 6px;
    border: 1px solid rgba(200, 161, 101, .5);
    background: linear-gradient(165deg, #fffdfb 0%, #fdf4f1 100%);
    box-shadow: 0 40px 90px -24px rgba(74, 59, 63, .45);
    transform: translateY(26px) scale(.94);
    opacity: 0;
    transition:
      transform .7s cubic-bezier(.18, .9, .25, 1.08),
      opacity .6s ease;
  }
  .overlay.open .card {
    transform: translateY(0) scale(1);
    opacity: 1;
    animation: cardGlow 3.6s ease-in-out 1s infinite;
  }
  @keyframes cardGlow {
    0%, 100% { box-shadow: 0 40px 90px -24px rgba(74,59,63,.45); }
    50%      { box-shadow: 0 40px 90px -24px rgba(74,59,63,.45),
                           0 0 40px rgba(200,161,101,.28); }
  }

  /* Bingkai tipis shimmer emas */
  .card::before {
    content: '';
    position: absolute; inset: 11px;
    border-radius: 3px;
    pointer-events: none;
    background: linear-gradient(120deg,
      rgba(200,161,101,.55) 0%,
      rgba(200,161,101,.15) 35%,
      rgba(255,255,255,.7) 50%,
      rgba(200,161,101,.15) 65%,
      rgba(200,161,101,.55) 100%);
    background-size: 250% 250%;
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    padding: 1px;
    animation: shimmer 4.5s linear infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 0%; }
    100% { background-position: 250% 250%; }
  }

  /* Kilau melintas di kartu */
  .card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit; pointer-events: none;
    background: linear-gradient(105deg,
      transparent 40%,
      rgba(255,255,255,.55) 50%,
      transparent 60%);
    background-size: 300% 300%;
    animation: sweep 5.5s ease-in-out 1.5s infinite;
    mix-blend-mode: soft-light;
  }
  @keyframes sweep {
    0%   { background-position: 200% 0; }
    60%  { background-position: -80% 0; }
    100% { background-position: -80% 0; }
  }

  .close {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: transparent; color: #a8979c;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
    transition: background .3s, color .3s, transform .3s;
  }
  .close:hover {
    background: rgba(200,161,101,.14);
    color: #5c464c;
    transform: rotate(90deg);
  }

  /* Ornamen hati berdenyut */
  .ornament {
    color: var(--gold);
    font-size: 1.5rem;
    letter-spacing: .4em;
    margin-bottom: 14px;
    display: inline-block;
    animation: heartbeat 1.8s ease-in-out .8s infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.12); }
    60%      { transform: scale(1); }
  }

  .card h2 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: clamp(2rem, 7vw, 2.7rem);
    color: #5c464c; margin-bottom: 18px;
  }

  .card p.msg {
    font-size: clamp(1.02rem, 3.4vw, 1.16rem);
    line-height: 1.95; color: #5b4a4f;
    font-style: italic;
    min-height: 1em;
  }

  /* Kursor ketik */
  .type-cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--rose);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 26px auto 18px; width: 70%;
    color: var(--gold); font-size: .8rem;
    opacity: 0;
    animation: fadeUp .9s ease 2.6s forwards;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,161,101,.7), transparent);
  }

  .signature {
    font-family: 'Great Vibes', cursive;
    font-size: 1.5rem; color: var(--rose);
    opacity: 0;
    animation: fadeUp .9s ease 2.9s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Sparkle di sekitar kartu */
  .sparkle {
    position: absolute;
    color: var(--gold);
    font-size: 12px;
    pointer-events: none;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1.1) rotate(180deg); }
  }

  /* Responsif */
  @media (max-width: 480px) {
    .card { padding: 44px 24px 34px; }
    .card::before { inset: 8px; }
  }

  /* Kurangi animasi */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="petals" aria-hidden="true"></div>

  <main class="stage">
    <p class="eyebrow">Sebuah Pesan Kecil</p>
    <h1 class="title">Untuk Kamu</h1>
    <p class="subtitle">yang selalu jadi bagian terhangat dalam hariku</p>
    <div class="rule"></div>
    <button class="btn" id="openBtn" type="button">Buka Lagi</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card" id="card">
      <button class="close" id="closeBtn" type="button" aria-label="Tutup">&times;</button>

      <div class="ornament">&#10086;</div>

      <h2 id="cardTitle">Hai, Sayang</h2>

      <p class="msg" id="msgText"></p>

      <div class="divider">&#9825;</div>

      <p class="signature">— Dari aku</p>
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgEl    = document.getElementById('msgText');
  const cardEl   = document.getElementById('card');

  const MESSAGE = 'Terima kasih sudah hadir dan memilih untuk tinggal.\nSetiap hal kecil darimu selalu membuat hariku terasa jauh lebih ringan.\n\nAku sayang kamu — hari ini, besok, dan seterusnya.';

  let typingTimer = null;

  // Efek mengetik dengan jeda per baris
  function typeMessage() {
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
    let i = 0;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    msgEl.appendChild(cursor);

    function step() {
      if (i < MESSAGE.length) {
        const ch = MESSAGE[i];
        // Sisipkan sebelum kursor
        if (ch === '\n') {
          cursor.before(document.createElement('br'));
        } else {
          cursor.before(document.createTextNode(ch));
        }
        i++;
        // jeda lebih lama di tanda baca
        const pause = /[.,!—]/.test(ch) ? 90 : 22;
        typingTimer = setTimeout(step, pause);
      } else {
        // selesai — hilangkan kursor setelah jeda
        setTimeout(() => cursor.remove(), 1200);
      }
    }
    step();
  }

  const openCard = () => {
    overlay.classList.add('open');
    setTimeout(typeMessage, 500);
    spawnSparkles();
  };
  const closeCard = () => {
    overlay.classList.remove('open');
    clearTimeout(typingTimer);
    msgEl.innerHTML = '';
    cardEl.querySelectorAll('.sparkle').forEach(s => s.remove());
  };

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

  // Pop-up otomatis setelah halaman dimuat
  window.addEventListener('load', () => setTimeout(openCard, 1400));

  // Kelopak / hati melayang
  (function createPetals() {
    const layer  = document.querySelector('.petals');
    const glyphs = ['\u2661', '\u2740', '\u2766', '\u273F'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      s.style.left              = Math.random() * 100 + 'vw';
      s.style.fontSize          = (12 + Math.random() * 16) + 'px';
      s.style.animationDuration = (14 + Math.random() * 14) + 's';
      s.style.animationDelay    = (-Math.random() * 22) + 's';
      s.style.opacity           = 0.35 + Math.random() * 0.4;
      layer.appendChild(s);
    }
  })();

  // Sparkle di sekitar kartu saat terbuka
  function spawnSparkles() {
    cardEl.querySelectorAll('.sparkle').forEach(s => s.remove());
    const positions = [
      { top: '10%', left: '6%'  }, { top: '18%', right: '8%' },
      { top: '55%', left: '4%'  }, { top: '62%', right: '6%' },
      { bottom: '14%', left: '12%' }, { bottom: '10%', right: '14%' },
      { top: '42%', left: '3%'  }, { top: '38%', right: '4%' }
    ];
    positions.forEach((pos, idx) => {
      const sp = document.createElement('span');
      sp.className = 'sparkle';
      sp.textContent = '✦';
      Object.assign(sp.style, pos);
      sp.style.animationDelay = (idx * 0.3) + 's';
      cardEl.appendChild(sp);
    });
  }
</script>
</body>
</html>
