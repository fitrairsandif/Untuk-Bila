<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font: Playfair Display (Judul Elegan), Cormorant Garamond (Isi), Outfit (Tombol) -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text-main: #1a1a1a; 
    --accent: #d4a373; 
    --bg-card: rgba(20, 20, 28, 0.95); 
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    color: var(--text-main);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: #f4f1ea;
  }

  /* =========================================
     BACKGROUND & TRANSISI
     ========================================= */
  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -4; transition: opacity 1.5s ease;
  }
  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    z-index: -4; opacity: 0; transition: opacity 1.5s ease;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: -3; transition: opacity 1s ease;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: rgba(5, 5, 15, 0.6); 
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: -3; opacity: 0; transition: opacity 1.5s ease;
  }
  .overlay.open ~ .bg-galaxy,
  .overlay.open ~ .overlay-galaxy { opacity: 1; }
  .overlay.open ~ .bg-sunflower { opacity: 0; }
  .overlay.open ~ .overlay-sunflower { opacity: 0; }

  /* Garis Abstrak di Background */
  .bg-lines {
    position: absolute; inset: 0; z-index: -2; pointer-events: none; opacity: 0.6;
  }
  .bg-lines svg { width: 100%; height: 100%; }
  .bg-lines path { fill: none; stroke-linecap: round; stroke: rgba(0, 0, 0, 0.1); transition: stroke 1.5s ease; }
  .overlay.open ~ .bg-lines path { stroke: rgba(212, 163, 115, 0.2); }

  /* =========================================
     HALAMAN UTAMA
     ========================================= */
  .stage {
    text-align: center; padding: 24px; z-index: 1;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* FONT: PLAYFAIR DISPLAY */
  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600;
    font-style: italic;
    line-height: 1.1; 
    color: #1a1a1a;
    margin-bottom: 15px;
    text-shadow: 0 4px 15px rgba(255,255,255,0.9);
  }

  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222; text-shadow: 0 2px 10px rgba(255,255,255,0.9);
    margin-bottom: 50px;
  }

  .btn {
    position: relative; overflow: hidden; background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; padding: 18px 50px;
    border: none; border-radius: 50px; cursor: pointer;
    transition: all 0.4s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px); }

  /* =========================================
     POP-UP MODAL & KARTU
     ========================================= */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    background: rgba(15, 15, 15, 0.4); 
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  /* WADAH KARTU */
  .card-wrapper {
    position: relative;
    width: min(480px, 100%);
  }

  /* KARTU UTAMA */
  .card {
    position: relative;
    width: 100%;
    max-height: 85vh; overflow-y: auto;
    padding: 60px 40px; text-align: center;
    background: var(--bg-card); 
    border-radius: 12px; 
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
    transform: translateY(40px) scale(0.95); opacity: 0;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    z-index: 2;
  }
  .overlay.open .card { transform: translateY(0) scale(1); opacity: 1; }

  /* =========================================
     GARIS BENANG TIDAK BERATURAN (THREADS)
     ========================================= */
  .thread-svg {
    position: absolute;
    top: -30px; left: -30px; right: -30px; bottom: -30px;
    width: calc(100% + 60px); height: calc(100% + 60px);
    z-index: 1; pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease 0.5s;
  }
  .overlay.open .thread-svg { opacity: 1; }

  .thread-svg path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.2;
    stroke-linecap: round;
    animation: threadMove 15s linear infinite alternate;
  }

  .thread-svg path:nth-child(1) { animation-duration: 12s; opacity: 0.8; }
  .thread-svg path:nth-child(2) { animation-duration: 18s; animation-delay: -2s; opacity: 0.6; }
  .thread-svg path:nth-child(3) { animation-duration: 14s; animation-delay: -5s; opacity: 0.9; }
  .thread-svg path:nth-child(4) { animation-duration: 20s; animation-delay: -1s; opacity: 0.5; }
  .thread-svg path:nth-child(5) { animation-duration: 16s; animation-delay: -8s; opacity: 0.7; }
  .thread-svg path:nth-child(6) { animation-duration: 22s; animation-delay: -4s; opacity: 0.4; }

  @keyframes threadMove {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(2deg) scale(1.02); }
  }

  /* Tombol Close */
  .close {
    position: absolute; top: 20px; right: 20px; z-index: 10;
    width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc; font-size: 1.2rem; line-height: 1;
    cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: var(--accent); color: #111; transform: rotate(90deg); }

  .card h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; 
    font-size: 2.2rem; color: var(--accent); margin-bottom: 25px;
  }

  /* Container Teks Pesan */
  .card p.msg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; line-height: 1.6; font-style: italic; font-weight: 400;
    color: #f0f0f0; display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: 0.5px;
  }

  /* ANIMASI SETIAP BARIS TEKS */
  .msg-line {
    display: block; min-height: 1.2em; opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  /* Kursor */
  .type-cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--accent); margin-left: 4px;
    vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .signature {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.5rem;
    color: var(--accent); margin-top: 35px; opacity: 0;
    animation: fadeUp 1s ease 4s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .card { padding: 50px 25px; }
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .card p.msg { font-size: 1.25rem; }
    .thread-svg {
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      width: calc(100% + 30px); height: calc(100% + 30px);
    }
  }
</style>
</head>
<body>

  <div class="bg-sunflower"></div>
  <div class="overlay-sunflower"></div>
  <div class="bg-galaxy"></div>
  <div class="overlay-galaxy"></div>

  <div class="bg-lines">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <path stroke-width="2">
        <animate attributeName="d" dur="15s" repeatCount="indefinite" values="
          M -100,200 C 300,100 700,500 1100,300;
          M -100,400 C 300,600 700,200 1100,500;
          M -100,200 C 300,100 700,500 1100,300
        " />
      </path>
      <path stroke-width="1.5">
        <animate attributeName="d" dur="20s" repeatCount="indefinite" values="
          M -100,600 C 400,800 600,200 1100,400;
          M -100,800 C 400,500 600,700 1100,600;
          M -100,600 C 400,800 600,200 1100,400
        " />
      </path>
    </svg>
  </div>

  <main class="stage">
    <h1 class="title">Untuk Bila</h1>
    <p class="subtitle">A Little Note For You</p>
    <button class="btn" id="openBtn" type="button">Buka Pesan</button>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="card-wrapper">
      
      <svg class="thread-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 5,10 Q -5,30 10,50 T 5,90 T 15,95" />
        <path d="M 95,5 Q 105,40 90,70 T 95,95 T 85,100" />
        <path d="M 20,5 Q 40,-10 50,15 T 80,5 T 95,15" />
        <path d="M 10,95 Q 30,110 50,85 T 85,95" />
        <path d="M 0,40 Q 30,20 50,40 T 100,50" />
        <path d="M 0,60 C 20,70 30,40 40,60 S 60,70 80,50 S 100,60 100,60" />
      </svg>

      <div class="card">
        <button class="close" id="closeBtn" type="button">&times;</button>
        
        <h2>Hai, Bila</h2>
        <p class="msg" id="msgContainer"></p>
        <p class="signature">— Dari aku, Fitra</p>
      </div>
      
    </div>
  </div>

<script>
  const overlay  = document.getElementById('overlay');
  const openBtn  = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const msgContainer = document.getElementById('msgContainer');

  const MESSAGE = 'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin pesan buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.';

  let typingTimer = null;

  function typeMessage() {
    clearTimeout(typingTimer);
    msgContainer.innerHTML = '';
    
    const lines = MESSAGE.split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineElement = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 1500);
        return;
      }

      const currentLineText = lines[lineIndex];

      if (charIndex === 0) {
        currentLineElement = document.createElement('div');
        currentLineElement.className = 'msg-line';
        msgContainer.appendChild(currentLineElement);
        currentLineElement.appendChild(cursor);
        
        setTimeout(() => {
          currentLineElement.classList.add('visible');
        }, 50);
      }

      if (charIndex < Array.from(currentLineText).length) {
        const char = Array.from(currentLineText)[charIndex];
        cursor.before(document.createTextNode(char));
        charIndex++;
        
        // ==========================================
        // PENGATURAN KECEPATAN KETIK (SMOOTH)
        // ==========================================
        let pause = 65; // Jeda per huruf (semakin besar semakin lambat)
        
        if (/[.,!?]/.test(char)) {
          pause = 250; // Jeda lebih lama saat koma/titik
        } else if (char === ' ') {
          pause = 80; // Jeda saat spasi sedikit lebih lama
        }
        
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++;
        charIndex = 0;
        // Jeda saat pindah baris baru
        typingTimer = setTimeout(typeLine, 300); 
      }
    }

    typeLine();
  }

  const openCard = () => {
    overlay.classList.add('open');
    setTimeout(typeMessage, 500); 
  };

  const closeCard = () => {
    overlay.classList.remove('open');
    clearTimeout(typingTimer);
    setTimeout(() => { msgContainer.innerHTML = ''; }, 500); 
  };

  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
</script>
</body>
</html>
